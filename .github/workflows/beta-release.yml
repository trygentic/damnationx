name: Beta release packages
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source commit to build (blank uses this workflow commit)
        default: ''
      platforms:
        description: Build all, linux, windows, android, or windows-android
        default: all
      android_artifact_run:
        description: Recheck an already built Android artifact from this run ID
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  linux:
    if: inputs.platforms == 'all' || inputs.platforms == 'linux'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Dependencies
        run: |
          Packaging/nix/debian-host-prep.sh --no-gcc
          sudo apt-get install -y gcc-14 g++-14 ninja-build libboost-dev libssl-dev libwayland-dev libxkbcommon-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev libvulkan-dev libx11-xcb-dev libxcb1-dev libasound2-dev libpulse-dev libudev-dev
          if [ "${{ matrix.arch }}" = arm64 ]; then
            sudo env NOSUDO=1 PREFIX= tools/build_and_install_smpq.sh
            echo /usr/local/bin >> "$GITHUB_PATH"
          fi
      - uses: actions/cache@v4
        with:
          path: build/dawn
          key: beta7-dawn-linux-${{ matrix.arch }}-31e25af
      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCPACK=ON -DBUILD_TESTING=OFF -DDISCORD_INTEGRATION=OFF \
            -DUSE_SDL3=ON -DDEVILUTIONX_WEBGPU=ON -DDEVILUTIONX_DAWN_JOBS=2 \
            -DDEVILUTIONX_SYSTEM_SDL3=OFF -DDEVILUTIONX_STATIC_SDL3=ON \
            -DDEVILUTIONX_SYSTEM_SDL_IMAGE=OFF -DDEVILUTIONX_SYSTEM_SDL_MIXER=OFF \
            -DDEVILUTIONX_SYSTEM_LIBSODIUM=OFF -DDEVILUTIONX_SYSTEM_BZIP2=OFF \
            -DDEVILUTIONX_LOBBY=ON -DDEVILUTIONX_DEFAULT_LOBBY_ORIGIN=https://lobby.damnationx.net \
            -DDEVILUTIONX_BUILD_LOBBY_CHECK=ON -DDEVILUTIONX_TRAINER=OFF
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: build/dawn
          key: beta7-dawn-linux-${{ matrix.arch }}-31e25af
      - name: Build
        run: cmake --build build -j 2 --target package damnationx-lobby-check
      - name: Read-only lobby verification without system CA files
        run: |
          mkdir -p /tmp/empty-ca
          SSL_CERT_FILE=/tmp/empty-ca/missing SSL_CERT_DIR=/tmp/empty-ca build/damnationx-lobby-check
          build/devilutionx --check-lobby
      - name: Package
        run: |
          STRIP_PACKAGE=1 TARBALL_DEB_RPM=0 Packaging/nix/LinuxReleasePackaging.sh
          mkdir -p dist
          mv devilutionx.tar.xz dist/DamnationX-1.6.0-beta.7-linux-${{ matrix.arch }}.tar.xz
          for f in build/*.deb build/*.rpm; do [ ! -f "$f" ] || cp "$f" dist/; done
      - uses: actions/upload-artifact@v4
        with:
          name: beta7-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
  windows:
    if: inputs.platforms == 'all' || inputs.platforms == 'windows' || inputs.platforms == 'windows-android'
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: lukka/get-cmake@latest
      - uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/downloads
          key: beta7-vcpkg-x64-static-boost-openssl-v1
      - name: Lobby dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install --classic boost-asio:x64-windows-static boost-beast:x64-windows-static openssl:x64-windows-static
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg failed' }
      - uses: actions/cache/save@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/downloads
          key: beta7-vcpkg-x64-static-boost-openssl-v1
      - uses: actions/cache@v4
        with:
          path: build/dawn
          key: beta7-dawn-windows-31e25af
      - name: Build
        shell: pwsh
        run: |
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static"
          tools/build-windows-webgpu.ps1 -BuildDir build -Jobs 4 -ExtraCMakeArgs @("-DDEVILUTIONX_LOBBY=ON", "-DDEVILUTIONX_DEFAULT_LOBBY_ORIGIN=https://lobby.damnationx.net", "-DDEVILUTIONX_BOOST_INCLUDE_DIR=$prefix/include", "-DOPENSSL_ROOT_DIR=$prefix", "-DOPENSSL_USE_STATIC_LIBS=ON", "-DDEVILUTIONX_BUILD_LOBBY_CHECK=ON", "-DDEVILUTIONX_TRAINER=OFF", "-DDISCORD_INTEGRATION=ON")
          cmake --build build --target damnationx-lobby-check --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic build failed' }
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: build/dawn
          key: beta7-dawn-windows-31e25af
      - name: Read-only lobby verification without system CA files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force empty-ca
          $env:SSL_CERT_FILE = "$PWD/empty-ca/missing"
          $env:SSL_CERT_DIR = "$PWD/empty-ca"
          Get-ChildItem build/_CPack_Packages -Recurse -Filter '*.dll' | ForEach-Object { Copy-Item $_.FullName build/ -Force }
          ./build/damnationx-lobby-check.exe
          if ($LASTEXITCODE -ne 0) { throw 'Lobby verification failed' }
          New-Item -ItemType Directory -Force dist
          Copy-Item build/devilutionx-*.zip dist/DamnationX-1.6.0-beta.7-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: beta7-windows-x64
          path: dist/*
          if-no-files-found: error
  android:
    if: inputs.platforms == 'all' || inputs.platforms == 'android' || inputs.platforms == 'windows-android'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Dependencies
        if: inputs.android_artifact_run == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext ninja-build
          sdkmanager 'ndk;29.0.14206865' 'cmake;3.31.0' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/cache@v4
        if: inputs.android_artifact_run == ''
        with:
          path: |
            lobby-deps
            android-dawn
            ~/.gradle/caches
          key: beta7-android-deps-openssl357-boost188-dawn31e25af
      - name: Build lobby dependencies
        if: inputs.android_artifact_run == ''
        env:
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/29.0.14206865
        run: bash tools/release-tools/android-lobby-deps.sh "$PWD/lobby-deps"
      - name: Build APK
        if: inputs.android_artifact_run == ''
        run: |
          cd android-project
          ./gradlew assembleDebug -Pwebgpu -PdawnJobs=2 -PdawnBuildRoot="$GITHUB_WORKSPACE/android-dawn" -PlobbyDepsRoot="$GITHUB_WORKSPACE/lobby-deps" --max-workers=2
      - uses: actions/cache/save@v4
        if: always() && inputs.android_artifact_run == ''
        with:
          path: |
            lobby-deps
            android-dawn
            ~/.gradle/caches
          key: beta7-android-deps-openssl357-boost188-dawn31e25af
      - name: Stage built APK
        if: inputs.android_artifact_run == ''
        run: |
          mkdir -p dist
          cp android-project/app/build/outputs/apk/debug/app-debug.apk dist/DamnationX-1.6.0-beta.7-android.apk
      - uses: actions/upload-artifact@v4
        if: inputs.android_artifact_run == ''
        with:
          name: beta7-android-built
          path: dist/*.apk
          if-no-files-found: error
      - name: Download APK for verification-only rerun
        if: inputs.android_artifact_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download '${{ inputs.android_artifact_run }}' --repo '${{ github.repository }}' -n beta7-android-built -D dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify actual APK with read-only lobby request
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            bash tools/release-tools/check-android-lobby.sh dist/DamnationX-1.6.0-beta.7-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: beta7-android
          path: dist/*
          if-no-files-found: error
