; DXM-A06 partial pack: overrides four logical IDs by inheriting them from the base sample
; package; every unlisted ID resolves to the next package and then local original game data.
[schema]
version = 1

[package]
id = dxm.a06.partial.samples
version = 1.0.0
aliases = dxm-a06-partial-samples

[dependencies]
dxm.a06.original.samples = >=1.0.0 <2.0.0

[capabilities]
provides = terrain,monster,item,ui
