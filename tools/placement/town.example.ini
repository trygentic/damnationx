; Example Tristram placement file (docs/design/static-mesh-placement.md). Copy to the HD pack as
; hd/3d/placements/town.ini and point the [mesh.*] files at real models; this example is not loaded by the game.
;
; The tile rectangles are the native building footprints from the town binding table of Douglas Pan's diablo-3d
; (Source/engine/render/town_editor_map.cpp, Sustainable Use License 1.0), modified for DamnationX: written as
; placement instances, and every mesh is anchored at the footprint's north corner (offset 0,0,0), so a model whose
; origin is that corner, +x along tile x and +z along tile y needs no yaw. Check the rectangles against the live town
; with DVL_W3D_DUMP_TOWN before relying on them (his maxima are treated as inclusive here).

[Placement]
format = damnationx.placement
version = 1

